<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>국가연구개발사업 제재처분 안건 초안 작성</title>
<script defer src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://webfontworld.github.io/kopub/KoPubDotum.css');
@import url('https://webfontworld.github.io/kopub/KoPubBatang.css');

:root{
  --ink:#1b2422; --ink-2:#414b46; --muted:#6f766f; --paper:#faf9f4; --paper-2:#f2f0e6;
  --line:#d9d6c9; --line-strong:#b7b39f; --navy:#1c3450; --navy-2:#274f76;
  --agent:#0f7d74; --agent-soft:#e7f4f1;
  --law:#4a3f82; --law-soft:#efecf8;
  --money:#1f6b46; --money-soft:#e9f5ee;
  --user:#2f6298; --user-soft:#eaf2fa;
  --amber:#96650f; --amber-soft:#fbf1dd;
  --danger:#a13c3c; --danger-soft:#faecec;
  --ok:#256b45; --focus:#1769aa;
  --shadow:0 10px 28px rgba(30,38,34,.08),0 2px 8px rgba(30,38,34,.05);
  --radius:10px;
  --font:"KoPub Dotum","Pretendard Variable",-apple-system,sans-serif;
  --serif:"KoPub Batang","Noto Serif KR",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:13px;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(35,45,40,.05) .5px,transparent .7px);background-size:5px 5px;mix-blend-mode:multiply;z-index:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 45%,transparent);outline-offset:2px}
a{color:var(--navy-2)}
::selection{background:color-mix(in srgb,var(--agent) 25%,transparent)}

/* 숫자 입력 스피너 숨김 */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.app{min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}

/* ===== Masthead ===== */
.masthead{background:var(--navy);color:#fff;border-bottom:1px solid #0e2135}
.masthead-top{height:54px;display:flex;align-items:center;gap:16px;padding:0 20px}
.seal{width:30px;height:30px;border:1.5px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:11px;font-weight:700;flex-shrink:0}
.brand-name{font-family:var(--serif);font-size:14.5px;letter-spacing:-.2px;line-height:1.25}
.brand-sub{font-size:9.5px;color:#b9c6d6;letter-spacing:1px;text-transform:uppercase}
.masthead-actions{margin-left:auto;display:flex;gap:8px}
.ghost-btn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;min-height:30px;padding:0 12px;border-radius:6px;font-size:11.5px;font-weight:600}
.ghost-btn:hover{background:rgba(255,255,255,.1)}
.law-strip{background:#0f253b;color:#c7d3e0;font-size:10.5px;padding:5px 20px;line-height:1.5}
.step-strip{background:#132c46;display:flex;align-items:center;padding:0 16px;overflow-x:auto;gap:2px}
.step-chip{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;color:#8ea3ba;white-space:nowrap;border-bottom:2.5px solid transparent}
.step-chip .num{width:16px;height:16px;border-radius:50%;border:1px solid #5c7089;display:grid;place-items:center;font-size:9px;flex-shrink:0}
.step-chip.done{color:#bcd6c8}
.step-chip.done .num{background:var(--agent);border-color:var(--agent);color:#fff}
.step-chip.active{color:#fff;border-bottom-color:var(--agent)}
.step-chip.active .num{background:#fff;color:var(--navy);border-color:#fff;font-weight:800}

/* ===== Workspace 3-panel ===== */
.workspace{display:grid;grid-template-columns:20% 40% 40%;flex:1;min-height:0}
.workspace.discussion-mode{grid-template-columns:14% 56% 30%}
.panel{min-width:0;min-height:0;height:calc(100vh - 54px - 24px - 34px);overflow:auto}
.panel-log{background:#f5f4ee;border-right:1px solid var(--line)}
.panel-center{background:var(--paper)}
.panel-preview{background:#f1efe6;border-left:1px solid var(--line)}
.panel-inner{padding:16px}
.panel-title{position:sticky;top:0;z-index:5;background:inherit;padding:12px 14px;border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.panel-title h2{font-family:var(--serif);font-size:13px;margin:0;color:var(--navy)}
.panel-title .eyebrow{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}

/* mobile tabs */
.mobile-tabs{display:none}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr;display:block}
  .panel{height:auto;border:none!important}
  .panel{display:none}
  .panel.mobile-active{display:block}
  .mobile-tabs{display:flex;gap:0;background:#eceae0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  .mobile-tabs button{flex:1;padding:10px 6px;font-size:11.5px;font-weight:700;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent}
  .mobile-tabs button.active{color:var(--navy);border-bottom-color:var(--navy);background:#fff}
}

/* ===== Cards / notes ===== */
.note-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;position:relative}
.note-card.compact{padding:14px}
.note-card.soft{background:linear-gradient(180deg,#fff 0%,#fbfaf4 100%)}
.note-card h3{margin:0 0 10px;font-size:13.5px;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;align-items:center;gap:8px}
.note-card h3 .tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--paper-2);color:var(--muted)}
.field{margin-bottom:0}
.field label{display:block;font-weight:700;font-size:11px;margin-bottom:4px;color:var(--ink-2)}
.field .example{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
.input,.textarea,.select{width:100%;border:1px solid var(--line-strong);background:#fff;color:var(--ink);padding:7px 9px;border-radius:6px;min-height:34px;font-size:12px}
.textarea{min-height:76px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{border-color:var(--focus);box-shadow:0 0 0 2px rgba(23,105,170,.15);outline:0}
.input::placeholder,.textarea::placeholder{color:#a7ab9e;font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.form-grid.c3{grid-template-columns:repeat(3,1fr)}
.form-grid.c1{grid-template-columns:1fr}
@media (max-width:560px){.form-grid,.form-grid.c3{grid-template-columns:1fr}}

.btn{border:1px solid var(--line-strong);background:#fff;color:var(--ink);min-height:34px;padding:6px 13px;border-radius:6px;font-weight:700;font-size:11.5px; display:inline-flex; align-items:center; justify-content:center;}
.btn:hover:not(:disabled){background:var(--paper-2)}
.btn:disabled{opacity:0.6; cursor:wait;}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--navy-2)}
.btn.agent{background:var(--agent);border-color:var(--agent);color:#fff}
.btn.law{background:var(--law);border-color:var(--law);color:#fff}
.btn.money{background:var(--money);border-color:var(--money);color:#fff}
.btn.danger-o{color:var(--danger);border-color:#e2b8b8;background:#fff;}
.btn.danger-o:hover{background:var(--danger-soft);}
.btn.small{min-height:27px;padding:4px 10px;font-size:10.5px}
.btn.block{width:100%}
.actions-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}

/* status badges - color + text always */
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;border:1px solid transparent}
.bg-ok{background:#e6f2ea;color:var(--ok);border-color:#bfe0cc}
.bg-ok2{background:#e6f2ea;color:var(--ok);border-color:#bfe0cc}
.bg-user{background:var(--user-soft);color:var(--user);border-color:#c3d9ec}
.bg-info{background:#eef1f6;color:#43536b;border-color:#cfd7e4}
.bg-warn{background:var(--amber-soft);color:var(--amber);border-color:#e9d29d}
.bg-hold{background:#f0eee6;color:#6b6455;border-color:#d9d3c1}
.bg-danger{background:var(--danger-soft);color:var(--danger);border-color:#eabcbc}
.bg-final{background:#eaf1e9;color:#2c5c2f;border-color:#bcd6bd;font-weight:900}
.bg-plain{background:#eee;color:#555;border-color:#ddd}

/* ===== persona identity blocks ===== */
.persona-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.persona-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0;color:#fff}
.persona-icon.agent{background:var(--agent)}
.persona-icon.law{background:var(--law)}
.persona-icon.money{background:var(--money)}
.persona-icon.user{background:var(--user)}
.persona-name{font-weight:800;font-size:11.5px}
.persona-name.agent{color:var(--agent)}
.persona-name.law{color:var(--law)}
.persona-name.money{color:var(--money)}
.persona-name.user{color:var(--user)}
.persona-role{font-size:9.5px;color:var(--muted)}

.agent-card{border-left:4px solid var(--agent);background:var(--agent-soft);border-radius:0 8px 8px 0;padding:10px 12px;margin:8px 0;font-size:11.5px;animation:fadeIn .3s ease}
.agent-card.law{border-left-color:var(--law);background:#f7f4fc}
.agent-card.money{border-left-color:var(--money);background:#f2fbf6}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* current-topic banner */
.topic-banner{background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:11.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.topic-banner b{font-weight:800}
.topic-banner .sub{color:#b9cfe2;font-size:10.5px}

/* agent command center */
.agent-command{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(30,38,34,.05);padding:12px 16px}
.agent-command-inner{display:grid;grid-template-columns:1.25fr 1fr auto;gap:12px;align-items:center;max-width:1280px;margin:0 auto}
.agent-kicker{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--agent);font-weight:900}
.agent-command h2{font-family:var(--serif);font-size:14px;margin:2px 0;color:var(--navy)}
.agent-command p{margin:0;color:var(--ink-2);font-size:11.5px;line-height:1.55}
.agent-gates{display:flex;gap:6px;flex-wrap:wrap}
.gate-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper-2);color:var(--muted);border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800}
.gate-pill.pass{background:var(--agent-soft);border-color:#b5d9d4;color:var(--agent)}
.gate-pill.stop{background:var(--danger-soft);border-color:#eabcbc;color:var(--danger)}
.agent-command-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:980px){.agent-command-inner{grid-template-columns:1fr}.agent-command-actions{justify-content:flex-start}}

/* review item row */
.review-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}

/* preview paper */
.preview-paper{background:#fff;border:1px solid #d6d1c1;box-shadow:0 6px 20px rgba(40,40,30,.07);padding:22px;font-family:var(--serif)}
.preview-kicker{font-family:var(--font);font-size:9.5px;color:#767a6c;letter-spacing:1.6px;border-bottom:1px solid #2a2f29;padding-bottom:6px;margin-bottom:16px}
.preview-paper h1{font-size:18px;text-align:center;margin:0 0 18px}
.preview-paper h2{font-size:13px;margin:18px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.preview-paper h3{font-size:12px;margin:10px 0 5px}
.preview-paper p,.preview-paper li{font-family:var(--font);font-size:11.5px;line-height:1.65}
.preview-paper table{width:100%;border-collapse:collapse;margin:6px 0;font-family:var(--font);font-size:10.5px}
.preview-paper th,.preview-paper td{border:1px solid #c7c3b6;padding:6px 7px;text-align:left;vertical-align:top}
.preview-paper th{background:#f1efe6;width:24%;font-weight:800}
.pending-fill{color:var(--muted);font-style:italic}
.src-badge{font-size:8.5px;background:#eee;color:#666;padding:1px 5px;border-radius:8px;margin-left:4px;font-family:var(--font);white-space:nowrap}

/* chat widget */
.chat-widget{position:fixed;bottom:20px;right:20px;background:var(--agent);color:#fff;padding:9px 16px;border-radius:24px;cursor:pointer;z-index:200;display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;box-shadow:0 4px 16px rgba(15,125,116,.38);user-select:none;transition:filter .15s}
.chat-widget:hover{filter:brightness(1.08)}
.chat-panel{position:fixed;bottom:62px;right:20px;width:320px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:201;display:none;flex-direction:column;max-height:440px}
.chat-panel.open{display:flex}
.chat-ph{background:var(--agent);color:#fff;padding:10px 14px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.chat-ph-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.cmsg-user{align-self:flex-end;background:var(--user-soft);border:1px solid #c3d9ec;border-radius:10px 10px 0 10px;padding:7px 10px;max-width:82%;font-size:11.5px}
.cmsg-agent{align-self:flex-start;background:var(--agent-soft);border:1px solid #b5d9d4;border-radius:10px 10px 10px 0;padding:7px 10px;max-width:92%;font-size:11.5px}
.chat-ir{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-shrink:0}
.chat-ir input{flex:1;border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12px}

/* ===== 페르소나 토론 UI (메신저 스타일) ===== */
.chat-row { display: flex; width: 100%; margin-bottom: 16px; gap: 10px; animation: fadeIn 0.3s ease; }
.chat-row.law { flex-direction: row; }
.chat-row.acc { flex-direction: row-reverse; }
.chat-row.sys, .chat-row.usr { justify-content: center; }

.chat-avatar { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.08); color: #fff;}
.chat-avatar.law { background: linear-gradient(135deg, var(--law), #6255a5); }
.chat-avatar.acc { background: linear-gradient(135deg, var(--money), #2d8a5d); }
.chat-avatar.sys { background: var(--agent); }
.chat-avatar.usr { background: var(--user); }

.chat-body { display: flex; flex-direction: column; max-width: 75%; }
.chat-row.law .chat-body { align-items: flex-start; }
.chat-row.acc .chat-body { align-items: flex-end; }
.chat-row.sys .chat-body, .chat-row.usr .chat-body { align-items: center; max-width: 90%; }

.chat-name { font-size: 11px; font-weight: 800; margin-bottom: 4px; padding: 0 4px; }
.chat-name.law { color: var(--law); }
.chat-name.acc { color: var(--money); }
.chat-name.sys { color: var(--agent); }
.chat-name.usr { color: var(--user); }

.chat-bubble { padding: 12px 14px; border-radius: 14px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(24,30,26,0.06); position: relative; line-height: 1.6; }
.chat-bubble.law { background: var(--law-soft); border: 1px solid rgba(74,63,130,0.1); border-top-left-radius: 4px; }
.chat-bubble.acc { background: var(--money-soft); border: 1px solid rgba(31,107,70,0.1); border-top-right-radius: 4px; text-align: right; }
.chat-bubble.sys { background: var(--agent-soft); border: 1px solid rgba(15,125,116,0.2); text-align: center; }
.chat-bubble.usr { background: #fff; border: 2px solid var(--user); text-align: center; box-shadow: 0 4px 12px rgba(47,98,152,0.15); }

/* ── 모의 위원회 5인 전용 스타일 ── */
/* 이민준 변호사 (공격) — 적색 계열 */
.chat-row.law-prog{flex-direction:row}
.chat-avatar.law-prog{background:linear-gradient(135deg,var(--danger),#c45050)}
.chat-name.law-prog{color:var(--danger)}
.chat-bubble.law-prog{background:var(--danger-soft);border:1.5px solid rgba(161,60,60,.2);border-top-left-radius:4px}
/* 김태원 변호사 (수비) — 남보라 계열 */
.chat-row.law-cons{flex-direction:row}
.chat-avatar.law-cons{background:linear-gradient(135deg,#3d3472,#5c4fa0)}
.chat-name.law-cons{color:#3d3472}
.chat-bubble.law-cons{background:#f0edf9;border:1.5px solid rgba(61,52,114,.2);border-top-left-radius:4px}
/* 박서연 회계사 (공격) — 오렌지 계열 */
.chat-row.acc-prog{flex-direction:row-reverse}
.chat-avatar.acc-prog{background:linear-gradient(135deg,#a85a00,#d07800)}
.chat-name.acc-prog{color:#a85a00}
.chat-bubble.acc-prog{background:#fff4e6;border:1.5px solid rgba(168,90,0,.2);border-top-right-radius:4px;text-align:right}
/* 최두현 회계사 (수비) — 짙은 녹색 계열 */
.chat-row.acc-cons{flex-direction:row-reverse}
.chat-avatar.acc-cons{background:linear-gradient(135deg,var(--money),#2d8a5d)}
.chat-name.acc-cons{color:var(--money)}
.chat-bubble.acc-cons{background:var(--money-soft);border:1.5px solid rgba(31,107,70,.2);border-top-right-radius:4px;text-align:right}
/* 정상민 행정전문가 — 앰버/황금 계열 */
.chat-row.admin{flex-direction:row}
.chat-avatar.admin{background:linear-gradient(135deg,#7a520a,var(--amber))}
.chat-name.admin{color:#7a520a}
.chat-bubble.admin{background:var(--amber-soft);border:1.5px solid rgba(150,101,15,.25);border-top-left-radius:4px}
.chat-body.law-prog,.chat-body.law-cons,.chat-body.admin{align-items:flex-start}
.chat-body.acc-prog,.chat-body.acc-cons{align-items:flex-end}

/* log stream */
.log-entry{border-left:2px solid var(--line-strong);padding:5px 0 5px 10px;margin-bottom:2px;font-size:10.5px}
.log-entry .lt{color:var(--muted);font-size:9.5px}
.log-entry .la{font-weight:800;font-size:10.5px}
.log-entry.actor-agent{border-left-color:var(--agent)}
.log-entry.actor-lawyer{border-left-color:var(--law)}
.log-entry.actor-accountant{border-left-color:var(--money)}
.log-entry.actor-user{border-left-color:var(--user)}
.log-entry.actor-system{border-left-color:var(--amber)}

.progress-dots{display:flex;gap:4px;margin:4px 0 10px}
.progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.progress-dots span.on{background:var(--agent)}

.structured-block{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 13px;line-height:1.7;font-size:11.5px;white-space:pre-wrap}
.structured-block h4{margin:0 0 6px;font-size:12px;color:var(--navy)}
.structured-block .subtle{color:var(--muted);font-size:10.5px}
.term-pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#f3f5f7;border:1px solid #d9e0e6;font-size:10px;font-weight:700;color:#53616f;margin:2px 4px 0 0}

/* 양정기준(안) 버전 이력 */
.proposal-history{border:1.5px solid #91bdb5;border-left:4px solid var(--agent);background:#fbfffd;margin:0 0 12px;padding:11px 12px;border-radius:8px;box-shadow:0 5px 14px rgba(15,125,116,.08)}
.proposal-history.docked{position:relative;margin:0 0 8px;z-index:4;box-shadow:0 -5px 18px rgba(15,125,116,.11);border-width:1px 1px 1px 4px}
.proposal-history.docked::before{content:'현재 양정안';position:absolute;left:10px;top:-9px;background:var(--agent);color:#fff;border-radius:999px;padding:1px 7px;font-size:8.5px;font-weight:900;letter-spacing:.2px}
.proposal-history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.proposal-history-title{font-size:12px;font-weight:900;color:var(--agent)}
.proposal-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0;padding:7px 8px;background:var(--paper-2);border-radius:7px}
.proposal-step{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);background:#fff;color:var(--ink-2);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:800}
.proposal-step.current{border-color:var(--agent);background:var(--agent-soft);color:var(--agent)}
.proposal-step.confirmed{border-color:var(--ok);background:#e6f2ea;color:var(--ok)}
.proposal-step.rejected{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.proposal-arrow{color:var(--muted);font-weight:900;font-size:11px}
.proposal-current-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.proposal-current-item{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.proposal-current-item span{display:block;font-size:9.5px;color:var(--muted);font-weight:800;margin-bottom:2px}
.proposal-current-item b{font-size:11.5px;color:var(--navy);overflow-wrap:anywhere}
.proposal-version{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:7px;overflow:hidden}
.proposal-version summary{list-style:none;cursor:pointer;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:var(--navy)}
.proposal-version summary::-webkit-details-marker{display:none}
.proposal-version summary::after{content:'펼치기 ▾';font-size:9.5px;color:var(--muted);font-weight:700}
.proposal-version[open] summary::after{content:'접기 ▴'}
.proposal-version-body{border-top:1px solid var(--line);padding:10px 11px;background:#fcfcfa;display:grid;gap:7px}
.proposal-review{border-left:3px solid var(--line-strong);padding-left:9px;font-size:10.8px;line-height:1.6;color:var(--ink-2)}
.proposal-review.law{border-left-color:var(--law)}.proposal-review.acc{border-left-color:var(--money)}.proposal-review.user{border-left-color:var(--user)}
.proposal-snapshot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 0}
.proposal-snapshot span{display:inline-flex;align-items:center;gap:3px;padding:4px 7px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:10px;color:var(--ink-2)}
.proposal-snapshot b{color:var(--navy)}
.proposal-master-dropdown{margin-top:8px;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}
.proposal-master-dropdown>summary{cursor:pointer;list-style:none;padding:8px 10px;color:var(--navy);font-size:10.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.proposal-master-dropdown>summary::-webkit-details-marker{display:none}
.proposal-master-dropdown>summary::after{content:'▾';color:var(--muted)}
.proposal-master-dropdown[open]>summary::after{content:'▴'}
.proposal-master-body{border-top:1px solid var(--line);padding:8px;background:#f8f8f5;max-height:330px;overflow:auto}
.proposal-version-label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px;font-size:11px;font-weight:900;color:var(--navy)}
.proposal-select-row{display:grid;grid-template-columns:minmax(120px,1fr) repeat(3,auto);gap:7px;align-items:end;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.proposal-select-row label{display:block;font-size:9.5px;color:var(--muted);font-weight:800;margin-bottom:3px}
.proposal-selected-detail{margin-top:8px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px;display:grid;gap:7px;max-height:245px;overflow:auto}
.proposal-selected-detail .proposal-version-body{margin:0;border:0;background:transparent;padding:0}
.proposal-direct-editor{margin-top:9px;border-color:rgba(47,98,152,.28);background:#f8fbff}
.proposal-direct-editor>summary{color:var(--user);background:#f3f8fd}
.proposal-direct-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:9px}
@media (max-width:560px){.proposal-current-grid{grid-template-columns:1fr}.proposal-select-row{grid-template-columns:1fr 1fr}.proposal-select-row>div:first-child{grid-column:1/-1}.proposal-history.docked{margin-left:-2px;margin-right:-2px}.chat-widget{display:none!important}.chat-panel{right:8px;left:8px;width:auto}}

  .masthead,.mobile-tabs,.panel-log,.panel-center,.floating-guide,.guide-popover,.no-print{display:none!important}
  .workspace{display:block}

}

/* Spinner for API loading */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  margin-right: 6px;
  vertical-align: middle;
}
.spinner.dark {
  border-color: rgba(0,0,0,.15);
  border-top-color: var(--navy);
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
/* 스트리밍 중 커서 깜빡임 */
.stream-cursor {
  display: inline-block;
  animation: blink .7s step-end infinite;
  opacity: .8;
  color: var(--agent);
}
@keyframes blink { 50% { opacity: 0; } }

<body>
<div id="app"></div>
<div id="chatWidget" class="chat-widget no-print" onclick="toggleChat()">💬 <span style="font-size:11px">도움이 필요하세요?</span></div>
<div id="chatPanel" class="chat-panel no-print">
  <div class="chat-ph"><span>✦ 안내 도우미</span><button class="chat-ph-close" onclick="toggleChat()">×</button></div>
  <div id="chatMsgs" class="chat-msgs"></div>
  <div class="chat-ir">
    <input id="chatInput" placeholder="시스템 사용법이나 법령을 질문하세요..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="btn primary small" onclick="sendChat()">전송</button>
  </div>
</div>
<div id="apiKeyModal" class="api-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="apiModalTitle">
  <div class="api-modal">
    <div class="api-modal-head">
      <div class="api-modal-logo">AI</div>
      <div><h2 id="apiModalTitle">OpenAI API 연결</h2><p>AI 자동화를 사용하려면 먼저 API 키를 연결해 주세요.</p></div>
    </div>
    <form class="api-modal-body" onsubmit="connectOpenAIApi(event)">
      <label for="openaiApiKeyInput" style="display:block;font-size:11.5px;font-weight:800;margin-bottom:6px;color:var(--navy)">OpenAI API 키</label>
      <div class="api-key-wrap">
        <input id="openaiApiKeyInput" class="input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." aria-describedby="apiKeyHelp apiConnectionState">
        <button class="api-key-toggle" type="button" onclick="toggleApiKeyVisibility()">보기</button>
      </div>
      <div id="apiConnectionState" class="api-connect-state"><span class="api-dot"></span><span>API 키 입력 대기 중</span></div>
      <p id="apiKeyHelp" class="api-modal-help">입력한 키는 이 페이지가 열려 있는 동안에만 메모리에 유지되며 브라우저 저장소에는 저장되지 않습니다.</p>
      <div class="api-modal-actions">
        <button id="apiConnectButton" class="btn primary" type="submit">연결 확인</button>
      </div>
    </form>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   OpenAI API 통신 함수
   - API 키는 페이지 메모리에만 유지하고 브라우저 저장소에 남기지 않는다.
   - 실제 API 요청 성공 후에만 연결 상태를 완료로 표시한다.
   ============================================================ */
const OPENAI_MODELS = ['gpt-5.6-luna','gpt-4.1-mini','gpt-4o-mini'];
let openaiApiKey = '';
let openaiConnectionState = 'disconnected';
let cachedOpenAIModel = null;

function getOpenAIApiKey() {
  if (!openaiApiKey || openaiConnectionState !== 'connected') {
    openOpenAIApiDialog();
    throw new Error('OpenAI API가 연결되지 않았습니다. API 키를 연결해 주세요.');
  }
  return openaiApiKey;
}

function hasOpenAIApiKey() { return openaiConnectionState === 'connected' && !!openaiApiKey; }

function setApiConnectionState(state, message) {
  openaiConnectionState = state;
  const el = document.getElementById('apiConnectionState');
  if (el) {
    el.className = `api-connect-state ${state === 'connected' ? 'ok' : state === 'error' ? 'error' : state === 'testing' ? 'testing' : ''}`;
    el.innerHTML = `<span class="api-dot"></span><span>${esc(message)}</span>`;
  }
  document.querySelectorAll('[data-api-status]').forEach(el => {
    el.classList.toggle('connected', state === 'connected');
    const label = el.querySelector('[data-api-label]');
    if (label) label.textContent = state === 'connected' ? 'OpenAI 연결됨' : state === 'testing' ? '연결 확인 중' : 'OpenAI 미연결';
  });
}

function openOpenAIApiDialog() {
  const modal = document.getElementById('apiKeyModal');
  if (!modal) return;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  const input = document.getElementById('openaiApiKeyInput');
  if (input) { input.value = openaiApiKey; setTimeout(() => input.focus(), 0); }
  setApiConnectionState(hasOpenAIApiKey() ? 'connected' : 'disconnected', hasOpenAIApiKey() ? '✓ OpenAI API 연결 완료' : 'API 키 입력 대기 중');
}

function closeOpenAIApiDialog() {
  document.getElementById('apiKeyModal')?.classList.remove('open');
  document.body.style.overflow = '';
}

function toggleApiKeyVisibility() {
  const input = document.getElementById('openaiApiKeyInput');
  const button = document.querySelector('.api-key-toggle');
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  if (button) button.textContent = input.type === 'password' ? '보기' : '숨기기';
}

async function connectOpenAIApi(event) {
  event?.preventDefault();
  const input = document.getElementById('openaiApiKeyInput');
  const button = document.getElementById('apiConnectButton');
  const candidate = (input?.value || '').trim();
  if (!candidate) { setApiConnectionState('error', 'API 키를 입력해 주세요.'); input?.focus(); return; }
  setApiConnectionState('testing', 'OpenAI API 연결을 확인하고 있습니다…');
  if (button) { button.disabled = true; button.innerHTML = '<span class="spinner"></span>확인 중'; }
  try {
    const res = await fetch('https://api.openai.com/v1/models', {headers:{Authorization:`Bearer ${candidate}`}});
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error?.message || `연결 실패 (HTTP ${res.status})`);
    }
    const data = await res.json();
    const availableIds = new Set((data.data || []).map(model => model.id));
    cachedOpenAIModel = OPENAI_MODELS.find(model => availableIds.has(model)) || [...availableIds].find(model => /^gpt-(?:5|4)/.test(model)) || null;
    if (!cachedOpenAIModel) throw new Error('사용 가능한 OpenAI 텍스트 생성 모델을 찾을 수 없습니다.');
    openaiApiKey = candidate;
    setApiConnectionState('connected', `✓ OpenAI API 연결 완료 — ${cachedOpenAIModel} 사용 가능`);
    render();
    setTimeout(closeOpenAIApiDialog, 650);
  } catch (error) {
    openaiApiKey = '';
    cachedOpenAIModel = null;
    setApiConnectionState('error', `연결 실패: ${error.message}`);
  } finally {
    if (button) { button.disabled = false; button.textContent = '연결 확인'; }
  }
}

function resetOpenAIApiKey() {
  openaiApiKey = '';
  cachedOpenAIModel = null;
  setApiConnectionState('disconnected', 'API 키 입력 대기 중');
  render();
  openOpenAIApiDialog();
}

function extractOpenAIText(data) {
  if (typeof data.output_text === 'string') return data.output_text;
  return (data.output || []).flatMap(item => item.content || []).filter(part => part.type === 'output_text').map(part => part.text || '').join('');
}

async function getOpenAIResponse(prompt, maxTokens = 900) {
  const key = getOpenAIApiKey();
  const model = cachedOpenAIModel || OPENAI_MODELS[0];
  const res = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST',
    headers: {'Content-Type':'application/json',Authorization:`Bearer ${key}`},
    body: JSON.stringify({model,input:prompt,max_output_tokens:maxTokens,store:false})
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || `API 오류 (HTTP ${res.status})`);
  const text = extractOpenAIText(data);
  if (!text) throw new Error('OpenAI 응답에서 텍스트를 찾을 수 없습니다.');
  return text;
}

/* Responses API SSE 스트리밍 — 텍스트 delta가 도착하는 즉시 yield */
async function* streamOpenAIText(prompt, maxTokens = 900) {
  const key = getOpenAIApiKey();
  const model = cachedOpenAIModel || OPENAI_MODELS[0];
  const res = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST',
    headers: {'Content-Type':'application/json',Authorization:`Bearer ${key}`},
    body: JSON.stringify({model,input:prompt,max_output_tokens:maxTokens,store:false,stream:true})
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 오류 (HTTP ${res.status})`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const json = line.slice(5).trim();
      if (!json || json === '[DONE]') continue;
      try {
        const event = JSON.parse(json);
        if (event.type === 'response.output_text.delta' && event.delta) yield event.delta;
      } catch {}
    }
  }
}

function safeParseJSON(str) {
  try {
    const match = str.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    return JSON.parse(str);
  } catch(e) {
    throw e;
  }
}

/* ============================================================
   0. 유틸 및 상태
   ============================================================ */
let lastScrollY = 0;

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function fmtWon(n){
  if(n===null||n===undefined||n===''||isNaN(n)) return '';
  return Number(n).toLocaleString('ko-KR')+'원';
}
function nowStr(){
  const d=new Date();
  const p=(n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function uid(prefix){ return prefix+Math.random().toString(36).slice(2,8); }
function val(id){ const el=document.getElementById(id); return el? el.value : undefined; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value = v==null?'':v; }

// AI가 생성한 토론 텍스트에서 화자(법률/회계 페르소나)와 대사 분리
function parseDiscussionLines(text) {
  const msgs = [];

  // ── 전처리: 줄 단위로 분리하되 연속 빈 줄은 제거
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);

  // 모델이 생성할 수 있는 다양한 화자 라벨 포맷을 모두 처리
  // **, ##, 숫자+점, 꺽쇠, 대괄호 등 앞뒤 장식 허용
  const LAW_RE = /^(?:[*#\[<\d.\s]+)?\s*(?:법률\s*페르소나|변호사)\s*(?:[*\]>]+)?\s*[:\-]\s*([\s\S]*)/i;
  const ACC_RE = /^(?:[*#\[<\d.\s]+)?\s*(?:회계\s*페르소나|회계사)\s*(?:[*\]>]+)?\s*[:\-]\s*([\s\S]*)/i;
  // [제안|...] 태그만 단독으로 있는 행 감지
  const PROPOSAL_RE = /^\[제안\s*\|/;

  lines.forEach(line => {
    // ── [제안] 태그가 독립 행으로 온 경우 — 마지막 페르소나 발언에 붙임
    if (PROPOSAL_RE.test(line)) {
      const lastPersona = [...msgs].reverse().find(m => m.speaker === 'lawyer' || m.speaker === 'accountant');
      if (lastPersona) {
        // 이미 태그가 없을 때만 추가
        if (!lastPersona.text.includes('[제안|')) lastPersona.text += ' ' + line;
      } else {
        // 페르소나 발언이 아직 없으면 회계 페르소나로 임시 부여
        msgs.push({speaker: 'accountant', text: line});
      }
      return;
    }

    const lawMatch = line.match(LAW_RE);
    const accMatch = line.match(ACC_RE);

    if (lawMatch) {
      const t = lawMatch[1].trim();
      if (isMeaningfulPersonaText(t)) msgs.push({speaker: 'lawyer', text: t});
    } else if (accMatch) {
      const t = accMatch[1].trim();
      if (isMeaningfulPersonaText(t)) msgs.push({speaker: 'accountant', text: t});
    } else {
      // 나머지는 sys로 보관하되, [제안] 태그 포함 여부를 normalizeDiscussionScript에서 재처리
      msgs.push({speaker: 'sys', text: line});
    }
  });
  return msgs;
}

// normalizeDiscussionScript: sys 메시지 중 [제안] 태그가 있으면 마지막 페르소나에 붙임
function _attachOrphanProposalTags(msgs) {
  const result = [];
  msgs.forEach(m => {
    if (m.speaker === 'sys' && /\[제안\s*\|/.test(m.text)) {
      const lastP = [...result].reverse().find(r => r.speaker === 'lawyer' || r.speaker === 'accountant');
      if (lastP && !lastP.text.includes('[제안|')) {
        lastP.text += ' ' + m.text;
      }
      // sys [제안] 행 자체는 버림
    } else {
      result.push(m);
    }
  });
  return result;
}

function isMeaningfulPersonaText(text) {
  const compact = String(text || '').replace(/\s/g, '');
  if (!compact) return false;
  if (/^[.…·-]+$/.test(compact)) return false;
  if (compact === '...') return false;
  return compact.length >= 8;
}

/* ============================================================
   1. 법령 마스터 데이터
   ============================================================ */

/* 모의 토의 전용 파서 */
function parseMockDiscussionLines(text) {
  const msgs = [];
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  // "이민준:" / "이민준 변호사:" / "이민준 변호사(공격):" 등 모두 허용
  const PAT = Object.values(MOCK_COMMITTEE).map(p =>
    ({ re: new RegExp(`^(?:[*#\\[<\\d.\\s]+)?\\s*${p.name}\\s*(?:[\\w()가-힣 ]*)?\\s*(?:[*\\]>]+)?\\s*[:\\-]\\s*([\\s\\S]*)`, 'i'), key: p.key })
  );
  lines.forEach(line => {
    for (const { re, key } of PAT) {
      const m = line.match(re);
      if (m) {
        const t = m[1].trim();
        if (t.length >= 4) msgs.push({ speaker: key, text: t });
        return;
      }
    }
    msgs.push({ speaker: 'sys', text: line });
  });
  return msgs;
}

/* 모의 토의 전용 버블 빌더 */
function buildMockBubblesHtml(msgs) {
  return msgs.map(msg => {
    const p = MOCK_COMMITTEE[msg.speaker];
    if (!p) {
      // sys / usr
      const isSys = msg.speaker === 'sys';
      return `<div class="chat-row sys"><div class="chat-body sys">
        <div class="chat-bubble sys">
          <div style="font-weight:800;color:var(--agent);margin-bottom:3px">${isSys ? '✦ 시스템' : '👤 위원장'}</div>
          <div>${msg.text}</div>
        </div></div></div>`;
    }
    const cls = p.key;
    const bodyAlign = (p.side === 'right') ? 'align-items:flex-end' : 'align-items:flex-start';
    const badgeColor = {
      'law-prog':'var(--danger)', 'law-cons':'#3d3472',
      'acc-prog':'#a85a00', 'acc-cons':'var(--money)', 'admin':'#7a520a'
    }[cls] || 'var(--navy)';
    return `
    <div class="chat-row ${cls}">
      <div class="chat-avatar ${cls}" style="font-size:17px">${p.icon}</div>
      <div class="chat-body ${cls}" style="${bodyAlign}">
        <div class="chat-name ${cls}">
          ${p.fullName}&nbsp;<span style="font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;background:${badgeColor};color:#fff;vertical-align:middle">${p.badge}</span>
        </div>
        <div class="chat-bubble ${cls}">
          <div>${nl2br(esc(msg.text))}${msg.streaming ? '<span class="stream-cursor">▌</span>' : ''}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

  const app = document.getElementById('app');

  restoreSelectValues();
  
  requestAnimationFrame(() => { window.scrollTo(0, lastScrollY); });
}

function restoreSelectValues(){
  document.querySelectorAll('select[data-bind]').forEach(sel=>{
    const bind = sel.getAttribute('data-bind');
    const v = bind.split('.').reduce((o,k)=> (o? o[k] : undefined), cp);
    if(v!==undefined && v!==null) sel.value = v;
  });
}

function getAgentGates(){
  const hasCase = !!(cp.original_problem && cp.project.project_name && cp.target.person);
  const hasFunding = cp.funding.stages.length > 0 && cp.funding.stages.every(st => st.period_start && st.period_end && st.institutions.length);
  const hasInterview = cp.interviews.length >= Math.min((ui.interviewQs || buildInterviewQuestions()).length, 5);
  const hasProcedure = cp.procedure.steps.some(s => s.status !== '확인되지 않음');
  const hasDiscussion = ui.discScript.some(m => m.speaker === 'lawyer' || m.speaker === 'accountant');
  const hasProposal = cp.sanctions.confirmed_from_chat || !!(cp.sanctions.participation_restriction.final || cp.sanctions.recovery.final_amount || cp.sanctions.surcharge.final_amount);
  const hasDraft = !!cp.final_document_markdown || cp.phase >= 5;
  return [
    {key:'case', label:'사건', pass:hasCase},
    {key:'funding', label:'연구비', pass:hasFunding},
    {key:'interview', label:'인터뷰', pass:hasInterview},
    {key:'procedure', label:'절차', pass:hasProcedure},
    {key:'discussion', label:'토론', pass:hasDiscussion},
    {key:'proposal', label:'양정안', pass:hasProposal},
    {key:'draft', label:'안건초안', pass:hasDraft}
  ];
}

function getAgentRecommendation(){
  const gates = getAgentGates();
  const firstStop = gates.find(g => !g.pass);
  if(!firstStop) return {title:'안건 초안 생성과 모의검토까지 진행할 수 있습니다', detail:'핵심 입력과 산출물이 모두 준비되었습니다. 최종 안건 초안을 생성하거나 모의 처분 위원회로 리스크를 점검하세요.', action:'최종 안건 생성', fn:'agentNextAction()'};
  const map = {
    case:['사건 기본정보를 먼저 채워야 합니다','사건 개요, 과제명, 대상자, 연구개발기관 정보가 있어야 다음 단계 자동화가 안정적으로 작동합니다.','사건접수로 이동'],
    funding:['단계별 연구개발비 입력이 필요합니다','단계·기관별 정부지원금과 민간부담금이 있어야 환수와 제재부가금 검토의 기초가 분리됩니다.','사건접수로 이동'],
    interview:['확인 에이전트 인터뷰가 필요합니다','제재대상, 인지시점, 사용내역, 문제금액, 반복성 질문을 채워야 위반행위 요약이 만들어집니다.','사실확인으로 이동'],
    procedure:['절차확인 상태를 입력해야 합니다','문제 인지, 조사, 정산, 소명, 평가단, 사전통지 등 절차 상태가 안건 품질 게이트에 반영됩니다.','절차확인으로 이동'],
    discussion:['법률·회계 페르소나 토론이 필요합니다','토론을 통해 제31조·제32조 연결, 금액 분리, 귀책과 절차 리스크를 확인하고 양정기준(안)을 제안합니다.','토론 시작'],
    proposal:['양정기준(안)을 확정해야 합니다','4단계의 핵심 산출물인 참여제한·환수·제재부가금 검토안을 확정해야 심의안 정리로 이동할 수 있습니다.','양정안 확정'],
    draft:['심의안건 초안을 생성해야 합니다','확정된 양정기준(안)과 검토 기록을 문서 초안으로 통합할 차례입니다.','안건 생성']
  };
  const [title, detail, action] = map[firstStop.key];
  return {title, detail, action, fn:'agentNextAction()'};
}

function renderAgentCommandCenter(){
  const gates = getAgentGates();
  const rec = getAgentRecommendation();
  return `
  <section class="agent-command no-print" aria-label="에이전트 지휘판">
    <div class="agent-command-inner">
      <div>
        <div class="agent-kicker">Support Agent</div>
        <h2>${esc(rec.title)}</h2>
        <p>${esc(rec.detail)}</p>
      </div>
      <div class="agent-gates">
        ${gates.map(g=>`<span class="gate-pill ${g.pass?'pass':'stop'}">${g.pass?'✓':'!'} ${esc(g.label)}</span>`).join('')}
      </div>
      <div class="agent-command-actions">
        <button class="btn agent" onclick="${rec.fn}">${esc(rec.action)}</button>
        <button class="btn small" onclick="loadExampleData()">예시 전체 자동입력</button>
      </div>
    </div>
  </section>`;
}

function agentNextAction(){
  const firstStop = getAgentGates().find(g => !g.pass);
  if(!firstStop){
    cp.phase = 5;
    render();
    return;
  }
  if(firstStop.key === 'case' || firstStop.key === 'funding') cp.phase = 0;
  if(firstStop.key === 'interview') cp.phase = 1;
  if(firstStop.key === 'procedure') cp.phase = 2;
  if(firstStop.key === 'discussion') {
    cp.phase = 3;
    render();
    startDiscussion();
    return;
  }
  if(firstStop.key === 'proposal') cp.phase = 3;
  if(firstStop.key === 'draft') cp.phase = 5;
  render();
}

async function analyzeInitialProblemAPI() {
  const text = val('i_problem') || '';
  if(!text.trim()){ alert('먼저 사건 개요를 자연어로 입력해주세요.'); return; }
  cp.original_problem = text;

  const btn = document.getElementById('btn_analyze');
  if(btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner dark"></span> AI가 내용을 추출하여 양식을 채우고 있습니다...'; }

  const prompt = `
  너는 국가연구개발사업 제재처분 정보를 추출하는 AI야. 
  사용자가 입력한 사건 설명을 바탕으로 아래 JSON 포맷에 맞게 데이터를 추출해줘.
  없는 정보는 빈 문자열("")로 둬.
  반드시 마크다운 없이 순수 JSON 텍스트만 출력해.

  [입력 내용]
  ${text}

  [JSON 포맷]
  {
    "biz_name": "사업명",
    "project_name": "과제명",
    "project_number": "과제번호",
    "lead_institution": "주관기관",
    "partner_institution": "공동참여기관",
    "pi_name": "연구책임자",
    "co_pi_name": "공동기관 연구책임자",
    "total_period_start": "YYYY-MM-DD 형식 (예: 2023-01-01)",
    "total_period_end": "YYYY-MM-DD 형식 (예: 2025-12-31)",
    "target_institution": "처분 대상기관",
    "target_pi": "대상기관 연구책임자",
    "target_person": "처분 대상자",
    "predicted_issues": ["예상되는 쟁점 1", "쟁점 2"],
    "legal_issues": ["m1", "m2", "m3", "m4", "m5", "m6 중 해당 코드"],
    "sanction_grounds": ["s1", "s2", "s3", "s4", "s5", "s6 중 해당 코드"],
    "questioned_amount": "금액이 있다면 숫자만 (예: 3500000)"
  }`;

  try {
    const res = await getOpenAIResponse(prompt);
    const data = safeParseJSON(res);

    if(data.biz_name) cp.project.biz_name = data.biz_name;
    if(data.project_name) cp.project.project_name = data.project_name;
    if(data.project_number) cp.project.project_number = data.project_number;
    if(data.lead_institution) cp.project.lead_institution = data.lead_institution;
    if(data.partner_institution) cp.project.partner_institution = data.partner_institution;
    if(data.pi_name) cp.project.pi_name = data.pi_name;
    if(data.co_pi_name) cp.project.co_pi_name = data.co_pi_name;
    if(data.total_period_start) cp.project.total_period_start = data.total_period_start;
    if(data.total_period_end) cp.project.total_period_end = data.total_period_end;
    
    if(data.target_institution) cp.target.institution = data.target_institution;
    if(data.target_pi) cp.target.pi = data.target_pi;
    if(data.target_person) cp.target.person = data.target_person;
    
    if(data.predicted_issues) cp.predicted_issues = data.predicted_issues;
    if(data.legal_issues) cp.legal_issues = data.legal_issues;
    if(data.sanction_grounds) cp.sanction_grounds = data.sanction_grounds;

    if(data.questioned_amount) cp.sanctions.recovery.questioned_amount = Number(data.questioned_amount);

    ui.problemAnalyzed = true;
    addLog('시스템 에이전트','자동분석',`AI 자연어 분석 완료. 쟁점: ${cp.predicted_issues.join(', ')}`);
  } catch(e) {
    console.warn("JSON 파싱 에러 또는 API 에러, 수동 분석으로 대체", e);
    analyzeInitialProblemManual(text); 
  }
  
  if(btn) { btn.disabled = false; btn.innerHTML = 'AI 자연어 분석 및 자동 입력'; }
  render();
}

function analyzeInitialProblemManual(textParam){
  const text = textParam || val('i_problem') || '';
  if(!text.trim()) return;
  cp.original_problem = text;

  const kws=[];
  if(/목적\s*외|유흥|사적|사용\s*기준|용도/.test(text)) kws.push('연구개발비 사용기준 위반 가능성');
  if(/위조|변조|표절|저자/.test(text)) kws.push('자료·성과 위조·변조·표절 가능성');
  if(kws.length===0) kws.push('제재대상자 특정 및 제재사유 추가 확인 필요');
  cp.predicted_issues = kws;

  const detectedMisconduct=[];
  if(/위조|변조|표절/.test(text)) detectedMisconduct.push('m1');
  if(/목적\s*외|유흥|사적/.test(text)) detectedMisconduct.push('m2');
  cp.legal_issues = detectedMisconduct;

  const detectedGrounds=[];
  if(detectedMisconduct.length>0) detectedGrounds.push('s3');
  cp.sanction_grounds = detectedGrounds;

  ui.problemAnalyzed = true;
  addLog('시스템 에이전트','사건분석',`기본 분석 완료. 예상 쟁점: ${kws.join('/')}`);
}

            <td style="padding:4px 6px;border:1px solid var(--line)"><input type="number" class="input" style="min-height:28px" id="st_${si}_inst_${ii}_cash" value="${inst.private_cash!=null?inst.private_cash:''}"></td>

  cp.project.biz_name = val('i_bizName')||cp.project.biz_name;

  cp.project.project_number = val('i_prjNum')||cp.project.project_number;

/* ============================================================
   8. PHASE 1 — 사실확인 인터뷰
   ============================================================ */
function autoGenerateBehavior() {
  const detect = cp.interviews.find(i=>i.key==='detect_date');
  const facts = cp.interviews.map(i => {
    let label = i.question;
    if(i.key==='detect_date') label = '최초 확인 시점';
    if(i.key==='target_type') label = '제재대상 구분';
    if(i.key==='amount_rough') label = '문제금액 규모';
    return {label, answer:i.answer};
  });
  const lines = [];
  lines.push('[안건식 정리]');
  lines.push(`1. 사건 접수 개요: ${cp.original_problem || '사용자 입력 필요'}`);
  if(detect?.answer) lines.push(`2. 최초 문제 행위 확인 시점: ${detect.answer}`);
  lines.push('3. 인터뷰를 통해 정리된 사실관계:');
  facts.forEach((f, idx) => {
    lines.push(`   ${idx+1}) ${f.label}: ${f.answer}`);
  });
  lines.push('');
  lines.push('[정리된 쟁점]');
  lines.push('- 제재사유 해당성');
  lines.push('- 문제금액 및 환수 범위');
  lines.push('- 참여제한 및 제재부가금 산정 기준');
  return lines.join('\n');
}

      <div class="structured-block" style="background:#fbfcfd">
${cp.interviews.map((iv, idx)=>`${idx+1}. ${iv.question}

      </div>

    </div>`;
  } else {

   10. PHASE 3 — 법률·회계 종합 토론 (사용자 양정안 직접 확정 방식)
   ============================================================ */
function buildSystemAgentOpening(){
  const behavior = cp.violation.behavior || autoGenerateBehavior();
  const grounds = cp.sanction_grounds
    .map(k => legalReferences.sanctionGrounds.find(x => x.key === k))
    .filter(Boolean)
    .map(x => x.article)
    .join(', ') || '제32조제1항 해당 여부 검토 필요';
  const misconduct = cp.legal_issues
    .map(k => legalReferences.misconduct.find(x => x.key === k))
    .filter(Boolean)
    .map(x => x.article)
    .join(', ') || '제31조제1항 해당 여부 검토 필요';
  return `시스템 에이전트 초기 분석: 입력된 사건은 ${misconduct} 부정행위 후보와 ${grounds} 제재사유 후보의 연결 여부를 검토하는 사안입니다. 핵심은 사실·증거·법적 근거 연결, 기관/개인 귀책 분리, 환수·제재부가금 산정기초 분리입니다. 이하 토론은 법률 페르소나와 회계 페르소나가 각각 다른 관점에서 진행합니다.`;
}

function buildDiscussionPrompt(){
  const behavior = cp.violation.behavior || autoGenerateBehavior();
  const dateHint = (cp.interviews.find(i=>i.key==='detect_date')||{}).answer || '미입력';
  const qNum = cp.sanctions.recovery.questioned_amount || 3500000;
  const summary = [
    `[사건 개요]`,
    `- 최초 확인 시점: ${dateHint}`,
    `- 문제금액: ${fmtWon(qNum)}`,
    `- 위반행위 요약: ${behavior}`,
    ``,
    `[페르소나 구조]`,
    `- 시스템 에이전트는 초반 설명을 이미 1회 제공했으므로, 출력하지 않는다.`,
    `- 법률 페르소나는 법률요건, 제재사유, 참여제한 상당성, 기관/개인 귀책 분리를 검토한다.`,
    `- 회계 페르소나는 환수금, 제재부가금, 산식과 금액 개념 분리의 타당성을 검토한다.`,
    `- 두 페르소나는 서로 다른 성격과 관점을 유지하면서 반박·보완한다.`,
    ``,
    `[근거 제약]`,
    `- 확인 가능한 근거가 없는 내용은 단정하지 말고 "명확한 근거를 찾을 수 없음"이라고 쓴다.`,
    `- 법령·판례·기간·금액·배수·사례를 만들어내지 않는다.`,
    `- 최종 표현은 양정기준(안), 검토안, 심의안건 초안으로 제한한다.`,
    ``,
    `[출력 형식 — 반드시 준수]`,
    `- 모든 발언은 반드시 "법률 페르소나: " 또는 "회계 페르소나: "로 시작하는 줄로만 구성한다.`,
    `- **, ##, 숫자+점, 마크다운 헤더, 취소선 등 모든 마크다운 서식을 절대 사용하지 않는다.`,
    `- 말줄임표(...)나 자리표시자만 있는 줄은 출력하지 않는다.`,
    `- 반드시 법률 페르소나 발언이 최소 2줄, 회계 페르소나 발언이 최소 2줄 포함되어야 한다.`,
    `- 법률 페르소나와 회계 페르소나가 번갈아 가며 발언하는 대화 형태로 작성한다.`,
    `- 전체 4~8줄로 작성한다.`,
    `- 맨 마지막 줄은 반드시 회계 페르소나 발언이어야 하며, 그 줄 끝(줄 바꿈 없이 같은 줄)에 제안 태그를 이어붙인다.`,
    `- 태그 형식: [제안|참여제한:내용_또는_명확한_근거를_찾을_수_없음|환수금액:내용_또는_명확한_근거를_찾을_수_없음|제재부가금:내용_또는_명확한_근거를_찾을_수_없음|근거:한줄요약]`
  ].join('\n');

  return `너는 국가연구개발사업 제재처분을 검토하는 별개의 AI 페르소나 두 명이다.\n${summary}\n\n반드시 위 형식만 사용해서 토론과 제안 태그를 작성해. 빈 대사나 말줄임표만 있는 대사는 금지한다. 법률 페르소나와 회계 페르소나 둘 다 반드시 발언해야 한다.`;
}

function buildInitialDiscussionFallback(){
  const qNum = cp.sanctions.recovery.questioned_amount || 3500000;
  return [
    {speaker:'sys', text:buildSystemAgentOpening()},
    {speaker:'lawyer', text:`법률 페르소나 검토: 본 건은 연구개발비 사용의 적정성과 제31조제1항 부정행위 후보 해당 여부가 쟁점입니다. 구체 처분근거는 공식 원문으로 재확인해야 합니다.`},
    {speaker:'accountant', text:`회계 페르소나 검토: 문제금액은 우선 ${fmtWon(qNum)}으로 입력되어 있으나, 정산 불인정액·위반액·환수액·제재부가금 산정기초는 분리해야 합니다. [제안|참여제한:명확한 근거를 찾을 수 없음|환수금액:${qNum}원|제재부가금:명확한 근거를 찾을 수 없음|근거:환수 검토액 외 기간·배수는 공식 근거 재확인 필요]` }
  ];
}

async function buildDiscussionScript(){
  const prompt = buildDiscussionPrompt();
  try{
    const responseText = await getOpenAIResponse(prompt);
    const msgs = parseDiscussionLines(responseText);
    if(!msgs.length) return buildInitialDiscussionFallback();
    const normalized = normalizeDiscussionScript(msgs);
    if(normalized.filter(m => m.speaker === 'lawyer' || m.speaker === 'accountant').length < 2) return buildInitialDiscussionFallback();
    return normalized;
  }catch(err){
    console.error(err);
    return buildInitialDiscussionFallback();
  }
}

function normalizeDiscussionScript(msgs){
  // 1) sys 행에 고아 [제안] 태그가 있으면 마지막 페르소나로 이동
  const cleaned = _attachOrphanProposalTags(msgs);
  // 2) 페르소나 발언만 남김
  const personaMsgs = cleaned.filter(m => {
    if(m.speaker === 'usr') return true;
    if(m.speaker === 'lawyer' || m.speaker === 'accountant') return isMeaningfulPersonaText(m.text);
    return false;
  });
  return [{speaker:'sys', text:buildSystemAgentOpening()}, ...personaMsgs];
}

function getProposalHistory(){
  if(!cp.discussion) cp.discussion = {law_review:'', acc_review:'', completed_at:'', proposal_history:[]};
  if(!Array.isArray(cp.discussion.proposal_history)) cp.discussion.proposal_history = [];
  return cp.discussion.proposal_history;
}

function parseProposalFromText(text){
  const regex = /\[제안\s*\|\s*참여제한\s*:\s*([\s\S]*?)\s*\|\s*환수금액\s*:\s*([\s\S]*?)\s*\|\s*제재부가금\s*:\s*([\s\S]*?)\s*\|\s*근거\s*:\s*([\s\S]*?)\]/;
  const match = String(text || '').match(regex);
  if(!match) return null;
  return {participation:match[1].trim(), recovery:match[2].trim(), surcharge:match[3].trim(), basis:match[4].trim()};
}

function proposalSignature(p){
  return [p.participation,p.recovery,p.surcharge,p.basis].map(v=>String(v||'').trim()).join('|');
}

function summarizeProposalReview(messages, speaker){
  const label = speaker === 'lawyer' ? '법률 검토 없음' : speaker === 'accountant' ? '회계 검토 없음' : '사용자 의견 없음';
  const text = (messages || [])
    .filter(m => m.speaker === speaker)
    .map(m => String(m.text || '').replace(/\[제안[\s\S]*?\]/g,'').replace(/^(법률|회계)\s*페르소나\s*[:：]\s*/,'').trim())
    .filter(Boolean)
    .join(' / ');
  if(!text) return label;
  return text.length > 320 ? text.slice(0,317) + '…' : text;
}

function recordProposalVersion(messages, userText='', options={}){
  const proposal = (messages || []).map(m => parseProposalFromText(m.text)).filter(Boolean).pop();
  if(!proposal) return null;
  const history = getProposalHistory();
  const forceNew = !!options.forceNew;
  const existing = history.find(item => proposalSignature(item) === proposalSignature(proposal));
  if(existing && !forceNew) {
    if(userText && !String(existing.user_summary || '').includes(userText)) {
      const prior = !existing.user_summary || existing.user_summary === '사용자 의견 없음' ? '' : existing.user_summary + ' / ';
      existing.user_summary = (prior + userText).slice(0,320);
    }
    return existing;
  }
  const version = {
    id:uid('PROP'), version:history.length+1, ...proposal,
    law_summary:summarizeProposalReview(messages,'lawyer'),
    acc_summary:summarizeProposalReview(messages,'accountant'),
    user_summary:userText || summarizeProposalReview(messages,'usr'),
    status:'proposed', created_at:nowStr(), confirmed_at:'',
    request_type:forceNew?'additional':'standard'
  };
  history.forEach(item => { if(item.status === 'proposed') item.status = 'superseded'; });
  history.push(version);
  ui.proposalViewIndex=history.length-1;
  addLog('시스템 에이전트','양정안 제안',`${version.version}안 생성 — 참여제한 ${version.participation}, 환수 ${version.recovery}, 제재부가금 ${version.surcharge}`);
  return version;
}

function syncProposalHistoryFromChat(){
  let contextStart = 0;
  let latestUserText = '';
  ui.discScript.forEach((message,index) => {
    if(message.speaker === 'usr') {
      contextStart = index;
      latestUserText = String(message.text || '').trim();
    }
    if(parseProposalFromText(message.text)) {
      recordProposalVersion(ui.discScript.slice(contextStart,index+1), latestUserText);
    }
  });
  return getProposalHistory();
}

function ensureProposalHistoryFromDiscussion(){
  syncProposalHistoryFromChat();
  const history = getProposalHistory();
  if(history.length) return history;
  const meaningful = ui.discScript.filter(m =>
    (m.speaker === 'lawyer' || m.speaker === 'accountant') && !m.streaming && isMeaningfulPersonaText(m.text)
  );
  if(!meaningful.length) return history;

  // 모델이 제안 태그를 누락하거나 변형해도 토론 결과를 1안으로 보존한다.
  const fallback = extractLatestProposal();
  history.push({
    id:uid('PROP'), version:1,
    participation:fallback.participation,
    recovery:fallback.recovery,
    surcharge:fallback.surcharge,
    basis:fallback.basis,
    law_summary:summarizeProposalReview(ui.discScript,'lawyer'),
    acc_summary:summarizeProposalReview(ui.discScript,'accountant'),
    user_summary:summarizeProposalReview(ui.discScript,'usr'),
    status:'proposed', created_at:nowStr(), confirmed_at:''
  });
  addLog('시스템 에이전트','양정안 복구','토론 내용을 기준으로 최초 양정안 이력을 복구했습니다.');
  return history;
}

function extractLatestProposal(){
  const history = getProposalHistory();
  if(history.length) return history[history.length-1];
  const regex = /\[제안\s*\|\s*참여제한\s*:\s*([\s\S]*?)\s*\|\s*환수금액\s*:\s*([\s\S]*?)\s*\|\s*제재부가금\s*:\s*([\s\S]*?)\s*\|\s*근거\s*:\s*([\s\S]*?)\]/;
  const found = ui.discScript
    .map(m => String(m.text || '').match(regex))
    .filter(Boolean)
    .pop();
  const qNum = cp.sanctions.recovery.questioned_amount || 0;
  if(found) {
    return {
      participation: found[1].trim(),
      recovery: found[2].trim(),
      surcharge: found[3].trim(),
      basis: found[4].trim()
    };
  }
  return {
    participation: cp.sanctions.participation_restriction.final || UNKNOWN,
    recovery: cp.sanctions.recovery.final_amount ? String(cp.sanctions.recovery.final_amount) + '원' : (qNum ? String(qNum) + '원' : UNKNOWN),
    surcharge: cp.sanctions.surcharge.final_amount ? String(cp.sanctions.surcharge.final_amount) + '원' : UNKNOWN,
    basis: '토론 결과 제31조제1항 해당성, 제32조제1항 제재사유, 금액 개념 분리, 기관·개인 귀책 분리에 대한 추가 근거 확인 필요'
  };
}

async function startDiscussion(){
  if (discTimer) clearTimeout(discTimer);
  // 시스템 오프닝 + 스트리밍 플레이스홀더
  const openingMsg = {speaker:'sys', text: buildSystemAgentOpening()};
  const streamMsg  = {speaker:'lawyer', text:'', streaming: true};
  ui.discScript = [openingMsg, streamMsg];
  ui.discStep = 1;
  ui.discDone = false;
  ui.discPaused = false;
  ui.isApiLoading = true;
  getProposalHistory().forEach(p => { if(p.status === 'confirmed') p.status = 'superseded'; });
  cp.sanctions.confirmed_from_chat = false;
  addLog('시스템 에이전트','토론시작','스트리밍 토론을 시작합니다.');
  render();

  let fullText = '';
  try {
    for await (const chunk of streamOpenAIText(buildDiscussionPrompt(), 1500)) {
      fullText += chunk;
      streamMsg.text = fullText;
      patchDiscThread({streamOnly:true}); // 현재 스트리밍 말풍선의 텍스트만 갱신
    }
    // 스트리밍 완료 후 파싱
    const parsed = parseDiscussionLines(fullText);
    const normalized = normalizeDiscussionScript(parsed);
    // 법률·회계 페르소나 양쪽이 있어야 유효한 토론으로 인정
    const hasLawyer = normalized.some(m => m.speaker === 'lawyer');
    const hasAccountant = normalized.some(m => m.speaker === 'accountant');
    ui.discScript = (hasLawyer && hasAccountant) ? normalized : buildInitialDiscussionFallback();
  } catch(err) {
    console.error('[startDiscussion stream error]', err);
    ui.discScript = buildInitialDiscussionFallback();
  }
  // 모델이 제안 태그 형식을 일부 누락해도 최초 양정안 박스가 표시되도록 안전 제안을 기록한다.
  if(!recordProposalVersion(ui.discScript)) recordProposalVersion(buildInitialDiscussionFallback());

  ui.discStep = 0;
  ui.discDone = false;
  ui.isApiLoading = false;
  render();
  setTimeout(keepProposalComposerVisible,60);
  autoAdvanceDisc();
}

function autoAdvanceDisc() {
  if (ui.discStep < ui.discScript.length - 1 && !ui.discPaused) {
    discTimer = setTimeout(() => {
      ui.discStep++;
      patchDiscThread({appendOnly:true}); // 기존 말풍선을 유지하고 새 발언만 추가
      autoAdvanceDisc();
    }, 400); // 2500ms → 400ms
  } else if (ui.discStep >= ui.discScript.length - 1) {
    ui.discDone = true;
    // 페르소나 검토 내용을 cp에 영구 저장
    cp.discussion.law_review = ui.discScript
      .filter(m => m.speaker === 'lawyer')
      .map(m => m.text.replace(/\[제안[\s\S]*?\]/g, '').trim())
      .filter(Boolean).join('\n');
    cp.discussion.acc_review = ui.discScript
      .filter(m => m.speaker === 'accountant')
      .map(m => m.text.replace(/\[제안[\s\S]*?\]/g, '').trim())
      .filter(Boolean).join('\n');
    cp.discussion.completed_at = nowStr();
    render(); // 마지막에만 전체 렌더(제안 패널 표시)
    setTimeout(scrollToBottomDisc, 50);
    setTimeout(keepProposalComposerVisible,70);
  }
}

/* 토론 스레드 DOM만 부분 갱신 — 전체 render() 없이 스트리밍 중에도 호출 가능 */
function patchDiscThread({streamOnly=false, appendOnly=false} = {}) {
  const container = document.getElementById('discThreadContainer');
  if (!container) return;
  const visible = ui.discScript.slice(0, ui.discStep + 1);

  // 스트리밍 중에는 전체 말풍선을 다시 만들지 않고 텍스트 노드만 프레임당 1회 갱신한다.
  // 기존 chat-row의 fadeIn 애니메이션이 토큰마다 재시작되는 화면 깜빡임을 방지한다.
  if (streamOnly) {
    if (discStreamPatchFrame !== null) return;
    discStreamPatchFrame = requestAnimationFrame(() => {
      discStreamPatchFrame = null;
      const currentContainer = document.getElementById('discThreadContainer');
      const streamContent = currentContainer?.querySelector('[data-disc-stream-content]');
      const streamMsg = ui.discScript.slice(0, ui.discStep + 1).filter(m => m.streaming).pop();
      if (currentContainer && streamContent && streamMsg) {
        streamContent.innerHTML = nl2br(streamMsg.text);
        currentContainer.scrollTop = currentContainer.scrollHeight;
      }
    });
    return;
  }

  // 자동 진행 시 이미 표시된 말풍선은 보존하고 새 말풍선 하나만 뒤에 붙인다.
  if (appendOnly && container.children.length === visible.length - 1 && visible.length) {
    container.insertAdjacentHTML('beforeend', buildDiscBubblesHtml(visible.slice(-1)));
    container.scrollTop = container.scrollHeight;
    return;
  }

  container.innerHTML = buildDiscBubblesHtml(visible);
  container.scrollTop = container.scrollHeight;
}

/* 토론 말풍선 HTML 빌더 — renderPhase3와 patchDiscThread에서 공용 */
function buildDiscBubblesHtml(msgs) {
  return msgs.map(msg => {
    const isLaw = msg.speaker === 'lawyer';
    const isAcc = msg.speaker === 'accountant';
    const isSys = msg.speaker === 'sys';
    const cls = isLaw ? 'law' : (isAcc ? 'acc' : (isSys ? 'sys' : 'usr'));
    const icon = isLaw ? '⚖️' : (isAcc ? '📊' : (isSys ? '✦' : '👤'));
    const name = isLaw ? '법률 페르소나' : (isAcc ? '회계 페르소나' : (isSys ? '시스템 에이전트' : '사용자 개입'));

    let textToDisplay = msg.text;
    let proposalHtmlBlock = '';
    const regex = /\[제안\s*\|\s*참여제한\s*:\s*([\s\S]*?)\s*\|\s*환수금액\s*:\s*([\s\S]*?)\s*\|\s*제재부가금\s*:\s*([\s\S]*?)\s*\|\s*근거\s*:\s*([\s\S]*?)\]/;
    const match = textToDisplay.match(regex);
    if (match) {
      textToDisplay = textToDisplay.replace(regex, '').trim();
      const pR = match[1].trim(), pRec = match[2].trim(), pSur = match[3].trim(), pBas = match[4].trim();
      proposalHtmlBlock = `
      <div style="margin-top:12px;padding:12px;background:#fff;border:1.5px solid var(--agent);border-radius:10px;text-align:left;box-shadow:0 4px 12px rgba(15,125,116,.1)">
        <div style="font-size:11.5px;font-weight:800;color:var(--agent);margin-bottom:8px">💡 제재 양정(안) 제안</div>
        <div style="font-size:11.5px;margin-bottom:3px"><b>참여제한:</b> ${esc(pR)}</div>
        <div style="font-size:11.5px;margin-bottom:3px;color:var(--danger)"><b>환수금액:</b> ${esc(pRec)}</div>
        <div style="font-size:11.5px;margin-bottom:3px;color:var(--danger)"><b>제재부가금:</b> ${esc(pSur)}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-bottom:10px;line-height:1.4"><b>근거:</b> ${esc(pBas)}</div>
        <button class="btn primary block" style="height:36px;font-size:12px" data-part="${esc(pR)}" data-rec="${esc(pRec)}" data-sur="${esc(pSur)}" data-basis="${esc(pBas)}" onclick="selectProposalFromButton(this)">이 양정(안)으로 확정하기</button>
      </div>`;
    }

    if (msg.streaming) {
      // 스트리밍 중인 버블 — 커서 깜빡임 표시
      return `
      <div class="chat-row ${cls}">
        <div class="chat-avatar ${cls}">${icon}</div>
        <div class="chat-body">
          <div class="chat-name ${cls}">${name}</div>
          <div class="chat-bubble ${cls}"><div><span data-disc-stream-content>${nl2br(textToDisplay)}</span><span class="stream-cursor">▌</span></div></div>
        </div>
      </div>`;
    }

    if (isSys || msg.speaker === 'usr') {
      return `
      <div class="chat-row ${cls}">
        <div class="chat-body">
          <div class="chat-bubble ${cls}">
            <div style="font-weight:800;color:var(--${cls==='sys'?'agent':'user'});margin-bottom:4px">${icon} ${name}</div>
            <div>${nl2br(textToDisplay)}</div>
            ${proposalHtmlBlock}
          </div>
        </div>
      </div>`;
    }
    return `
    <div class="chat-row ${cls}">
      <div class="chat-avatar ${cls}">${icon}</div>
      <div class="chat-body">
        <div class="chat-name ${cls}">${name}</div>
        <div class="chat-bubble ${cls}"><div>${nl2br(textToDisplay)}</div>${proposalHtmlBlock}</div>
      </div>
    </div>`;
  }).join('');
}

/* OpenAI API를 활용한 동적 토론 및 양정 재제안 로직 */
async function submitDiscIntervention() {
  const input = document.getElementById('discIntervene');
  const t = (input ? input.value : val('discIntervene') || '').trim();
  if (!t || ui.isApiLoading) return;
  const isAdditionalProposalRequest = /추가\s*안건(?:을)?\s*제안/i.test(t);
  const isDirectProposalChange = /(바꿔|바꾸|변경|수정|조정|상향|하향|늘려|늘리|줄여|줄이|제외|삭제|반영|적용|대신)/i.test(t);
  const requiresNewProposal = isAdditionalProposalRequest || isDirectProposalChange;

  if (discTimer) clearTimeout(discTimer);
  ui.discDone = false;
  ui.isApiLoading = true;
  getProposalHistory().forEach(p => { if(p.status === 'confirmed') p.status = 'superseded'; });
  cp.sanctions.confirmed_from_chat = false;

  // 사용자 발언 추가
  ui.discScript.push({speaker: 'usr', text: t});
  if (input) input.value = '';
  addLog('사용자', '개입', t);

  // 스트리밍 플레이스홀더 추가
  const streamMsg = {speaker: 'lawyer', text: '', streaming: true};
  ui.discScript.push(streamMsg);
  ui.discStep = ui.discScript.length - 1;
  patchDiscThread();

  // 대화 맥락 (최근 6턴으로 제한 — 토큰 절약)
  const contextStr = ui.discScript
    .filter(m => m.speaker !== 'sys' && !m.streaming)
    .slice(-6)
    .map(m => {
      const role = m.speaker === 'lawyer' ? '법률 페르소나'
                 : m.speaker === 'accountant' ? '회계 페르소나' : '사용자';
      return `${role}: ${m.text.replace(/\[제안[\s\S]*?\]/g, '').trim()}`;
    }).join('\n');

  const proposalHistory = getProposalHistory();
  const latestProposal = proposalHistory[proposalHistory.length-1];
  const nextProposalNumber = proposalHistory.length + 1;
  const additionalProposalInstruction = isAdditionalProposalRequest ? `

[추가 안건 제안 특별 지시]
- 사용자는 기존 안의 반복 설명이 아니라 별도의 ${nextProposalNumber}안을 요청했다.
- 기존 안: 참여제한 ${latestProposal?.participation || '미정'}, 환수금액 ${latestProposal?.recovery || '미정'}, 제재부가금 ${latestProposal?.surcharge || '미정'}, 근거 ${latestProposal?.basis || '미정'}.
- 기존 안과 구별되는 대안을 제시하고, 어떤 전제·감경·가중·귀책·금액 판단이 달라졌는지 변호사와 회계사가 각각 설명한다.
- 확인된 근거만으로 실질적 변경이 불가능하면 이를 명시하고 조건부 대안을 제시한다. 법령·기간·배수·금액을 임의로 만들지 않는다.
- 마지막 제안 태그에는 새 ${nextProposalNumber}안의 내용을 반드시 넣는다.` : '';
  const directChangeInstruction = isDirectProposalChange ? `

[사용자 직접 변경 지시]
- 사용자가 제시한 기간·금액·범위·근거의 변경 내용을 최우선으로 반영한다.
- 변경 전후 차이를 변호사와 회계사가 짧게 검토한 뒤, 변경된 값을 마지막 제안 태그에 정확히 넣는다.
- 사용자가 명시하지 않은 값은 기존 안을 유지하며 임의의 수치나 법령을 만들지 않는다.` : '';

  const prompt = `국가연구개발사업 제재처분 검토 대화. 사건: ${cp.violation.behavior || autoGenerateBehavior()}. 문제금액: ${fmtWon(cp.sanctions.recovery.questioned_amount) || '미정'}.

[최근 대화]
${contextStr}

[지시]
- 사용자 발언에 법률 페르소나 또는 회계 페르소나가 답변. 필요하면 두 페르소나 모두 발언.
- 근거 불명확하면 "명확한 근거를 찾을 수 없음" 사용.
- 답변 마지막에 반드시 제안 태그 포함: [제안|참여제한:내용|환수금액:내용|제재부가금:내용|근거:요약]
- 출력: "법률 페르소나: ..." 또는 "회계 페르소나: ..."
${additionalProposalInstruction}${directChangeInstruction}`;

  let fullText = '';
  try {
    for await (const chunk of streamOpenAIText(prompt, 700)) {
      fullText += chunk;
      streamMsg.text = fullText;
      patchDiscThread({streamOnly:true});
    }
    streamMsg.streaming = false;

    // 파싱 후 교체
    const msgs = parseDiscussionLines(fullText);
    const cleaned = msgs.filter(m =>
      (m.speaker === 'lawyer' || m.speaker === 'accountant') && isMeaningfulPersonaText(m.text)
    );
    ui.discScript.pop(); // 스트리밍 플레이스홀더 제거
    if (cleaned.length > 0) {
      cleaned.forEach(m => ui.discScript.push(m));
    } else if (isMeaningfulPersonaText(fullText)) {
      ui.discScript.push({speaker: 'lawyer', text: fullText.trim()});
    } else {
      buildInitialDiscussionFallback()
        .filter(m => m.speaker !== 'sys')
        .forEach(m => ui.discScript.push(m));
    }
    addLog('시스템 에이전트', 'AI 답변', '개입 답변 완료.');
  } catch (error) {
    streamMsg.streaming = false;
    ui.discScript.pop();
    ui.discScript.push({speaker: 'sys', text: `오류: ${error.message}`});
    console.error('[submitDiscIntervention]', error);
  }

  const lastUserIndex = ui.discScript.map(m => m.speaker).lastIndexOf('usr');
  const proposalContext = ui.discScript.slice(Math.max(0,lastUserIndex));
  let recordedProposal = recordProposalVersion(proposalContext, t, {forceNew:requiresNewProposal});
  if(isAdditionalProposalRequest && !recordedProposal) {
    const prior = getProposalHistory().slice(-1)[0] || extractLatestProposal();
    const fallbackText = `[제안|참여제한:${prior.participation || UNKNOWN}|환수금액:${prior.recovery || UNKNOWN}|제재부가금:${prior.surcharge || UNKNOWN}|근거:추가안 요청에 대한 구조화 제안을 확인할 수 없어 기존안 유지 조건부 대안으로 기록함]`;
    const fallbackMessage = {speaker:'accountant', text:fallbackText};
    ui.discScript.push(fallbackMessage);
    recordedProposal = recordProposalVersion([{speaker:'usr',text:t},fallbackMessage], t, {forceNew:true});
  }
  ui.discStep = ui.discScript.length - 1;
  ui.isApiLoading = false;
  render();
  setTimeout(scrollToBottomDisc, 50);
  setTimeout(keepProposalComposerVisible,70);
}

function selectProposalFromButton(button){
  window.selectProposal(button.dataset.part || '', button.dataset.rec || '', button.dataset.sur || '', button.dataset.basis || '');
}

// 사용자가 채팅창 내부 또는 고정 이력 패널의 양정 제안 버튼을 클릭했을 때 실행
window.selectProposal = function(part, rec, sur, basis) {
  const history = getProposalHistory();
  let selected = history.find(p => proposalSignature(p) === proposalSignature({participation:part,recovery:rec,surcharge:sur,basis}));
  if(!selected) {
    const previous = history[history.length-1];
    selected = {
      id:uid('PROP'), version:history.length+1, participation:part, recovery:rec, surcharge:sur, basis,
      law_summary:previous?.law_summary || cp.discussion.law_review || '법률 검토 없음',
      acc_summary:previous?.acc_summary || cp.discussion.acc_review || '회계 검토 없음',
      user_summary:'사용자가 고정 패널에서 양정 내용을 수정하여 확정함',
      status:'proposed', created_at:nowStr(), confirmed_at:''
    };
    history.push(selected);
  }
  history.forEach(p => { if(p !== selected) p.status = 'superseded'; });
  selected.status = 'confirmed';
  selected.confirmed_at = nowStr();
  ui.proposalViewIndex=history.indexOf(selected);

  cp.sanctions.participation_restriction.final = part;
  cp.sanctions.participation_restriction.basis = basis;
  
  const recNum = parseInt(String(rec).replace(/[^0-9]/g, '')) || 0;
  const surNum = parseInt(String(sur).replace(/[^0-9]/g, '')) || 0;

  cp.sanctions.recovery.questioned_amount = cp.sanctions.recovery.questioned_amount || recNum;
  cp.sanctions.recovery.final_amount = recNum;
  cp.sanctions.recovery.formula = `전문가 토론 제안 수용: ${rec}`;
  
  if(surNum > 0 || sur.includes('해당')) {
      cp.sanctions.surcharge.applicable = true;
      cp.sanctions.surcharge.final_amount = surNum;
      cp.sanctions.surcharge.formula = `전문가 토론 제안 수용: ${sur}`;
      cp.sanctions.surcharge.basis = basis;
  } else {
      cp.sanctions.surcharge.applicable = false;
  }

  cp.sanctions.confirmed_from_chat = true;
  ui.discDone = true; 
  if(discTimer) clearTimeout(discTimer);
  
  addLog('사용자', '양정선택', `제안된 양정안 확정 수용 (참여제한: ${part}, 환수: ${rec}, 부가금: ${sur})`);
  ui.discScript.push({speaker:'sys', text:'사용자가 제안된 양정(안)을 확정했습니다. 아래 버튼을 눌러 다음 단계로 넘어가거나, 추가 의견을 계속 제시할 수 있습니다.'});
  ui.discStep = ui.discScript.length - 1;
  render();
  setTimeout(scrollToBottomDisc, 50);
}

function confirmProposalVersion(index){
  const proposal = getProposalHistory()[index];
  if(!proposal) return;
  window.selectProposal(proposal.participation, proposal.recovery, proposal.surcharge, proposal.basis);
}

function submitDirectProposalEdit(baseIndex){
  const history=getProposalHistory();
  const base=history[baseIndex] || history[history.length-1];
  if(!base || ui.isApiLoading) return;
  const edited={
    participation:(val('directProposalPart') || base.participation || UNKNOWN).trim(),
    recovery:(val('directProposalRecovery') || base.recovery || UNKNOWN).trim(),
    surcharge:(val('directProposalSurcharge') || base.surcharge || UNKNOWN).trim(),
    basis:(val('directProposalBasis') || base.basis || UNKNOWN).trim()
  };
  const reason=(val('directProposalReason') || '').trim();
  if(proposalSignature(edited)===proposalSignature(base)){
    alert('변경된 양정 내용이 없습니다. 참여제한·환수금액·제재부가금·근거 중 하나를 수정해 주세요.');
    return;
  }
  const labels={participation:'참여제한',recovery:'환수금액',surcharge:'제재부가금',basis:'근거'};
  const changes=Object.keys(labels).filter(key=>String(base[key]||'').trim()!==edited[key]).map(key=>`${labels[key]}: ${base[key]||UNKNOWN} → ${edited[key]}`);
  history.forEach(item=>{if(item.status==='proposed'||item.status==='confirmed') item.status='superseded';});
  const version={
    id:uid('PROP'),version:history.length+1,...edited,
    law_summary:base.law_summary||'이전 안의 법률 검토내용을 승계함',
    acc_summary:base.acc_summary||'이전 안의 회계 검토내용을 승계함',
    user_summary:`사용자 직접 수정 · ${changes.join(' / ')}${reason?` / 수정 사유: ${reason}`:''}`.slice(0,320),
    status:'proposed',created_at:nowStr(),confirmed_at:'',request_type:'user_edit',base_version:base.version
  };
  history.push(version);
  ui.proposalViewIndex=history.length-1;
  cp.sanctions.confirmed_from_chat=false;
  ui.discDone=false;
  ui.discScript.push({speaker:'usr',text:`${base.version}안을 직접 수정하여 ${version.version}안을 제안합니다. ${changes.join(' / ')}${reason?` / 사유: ${reason}`:''}`});

function mdToHtml(md){
  const rawLines = md.split('\n');
  let html=''; let tableRows=[]; let inTable=false;
  function flushTable(){
    if(tableRows.length){
      const body = tableRows.filter(r=>!(r.length && /^-+$/.test(r[0])));
      html += '<table>' + body.map((r,i)=>`<tr>${r.map(c=>`<${i===0?'th':'td'}>${c}</${i===0?'th':'td'}>`).join('')}</tr>`).join('') + '</table>';
      tableRows=[];
    }
    inTable=false;
  }
  rawLines.forEach(raw=>{
    const trimmed = raw.trim();
    if(/^\|.*\|$/.test(trimmed)){
      if(/^\|[\s:-]+\|$/.test(trimmed)) return; 
      const cells = trimmed.slice(1,-1).split('|').map(c=>esc(c.trim()));
      tableRows.push(cells); inTable=true; return;
    } else if(inTable) flushTable();
    const line = esc(raw);
    if(/^# /.test(raw)) html+=`<h1>${line.slice(2)}</h1>`;
    else if(/^## /.test(raw)) html+=`<h2>${line.slice(3)}</h2>`;
    else if(/^- /.test(raw)) {
        let text = line.slice(2).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        html+=`<li>${text}</li>`;
    }
    else if(/^> /.test(raw)) html+=`<p class="pending-fill">${line.slice(2)}</p>`;
    else if(trimmed==='---') html+='<hr>';
    else if(trimmed==='') html+='';
    else html+=`<p>${line}</p>`;
  });
  flushTable();
  html = html.replace(/(?:<li>[\s\S]*?<\/li>)+/g, m=>'<ul>'+m+'</ul>');
  return html;
}
