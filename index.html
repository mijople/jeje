/* ============================================================
   13. PHASE 6 — 모의 처분 위원회 (리스크 점검 - 동적 API 연동)
   ============================================================ */
function scrollToBottomMockDisc() {
  const t = document.getElementById('mockDiscThreadContainer');
  if(t) t.scrollTop = t.scrollHeight;
}

function patchMockDiscThread() {
  const c = document.getElementById('mockDiscThreadContainer');
  if (!c) return;
  c.innerHTML = buildMockBubblesHtml(ui.mockDiscScript.slice(0, ui.mockDiscStep + 1));
  c.scrollTop = c.scrollHeight;
}

async function startMockDiscussion(){
  if (mockDiscTimer) clearTimeout(mockDiscTimer);

  const openingMsg = {speaker:'sys', text:`모의 처분 위원회를 시작합니다. 5인의 전문가가 아래 확정 안건의 소송 리스크와 미비점을 집중 점검합니다.\n참여제한: ${cp.sanctions.participation_restriction.final||'미정'} / 환수: ${fmtWon(cp.sanctions.recovery.final_amount)||'미정'} / 제재부가금: ${cp.sanctions.surcharge.applicable===false?'해당없음':(fmtWon(cp.sanctions.surcharge.final_amount)||'미정')}`};
  const streamMsg = {speaker:'law-prog', text:'', streaming: true};
  ui.mockDiscScript = [openingMsg, streamMsg];
  ui.mockDiscStep = 1;
  ui.mockDiscDone = false;
  ui.isMockApiLoading = true;
  addLog('시스템 에이전트','모의토론시작','5인 위원 모의 처분 토의를 시작합니다.');
  render();

  const prompt = `너는 국가연구개발사업 제재처분 심의 위원회의 다섯 전문가를 동시에 연기하는 AI다.
각 위원은 서로 다른 성향·말투를 가지며, 아래 역할에 맞게 발언해야 한다.

[위원 구성 및 성격]
1. 이민준 변호사(공격): 정부 패소 판례를 꿰고 있는 공격형. 절차·재량 결함을 예리하게 찌름. 단호·직설. "이건 취소 가능합니다", "절차 하자가 있어요" 식.
2. 김태원 변호사(수비): 조문 원문 중심 수비형. 신중·완서. "원문을 다시 확인하겠습니다", "아직 단정하기 어렵습니다" 식.
3. 박서연 회계사(공격): 금액 산정 오류 공격형. 예리·빠름. "이 산식 기초가 틀렸어요", "환수와 부가금 기준이 혼용됐습니다" 식.
4. 최두현 회계사(수비): 정산서 줄 단위 검토형. 꼼꼼·단계적. "서두르지 맙시다, 하나씩 확인합시다" 식.
5. 정상민 행정전문가: 조문만 인용하는 가장 엄격한 전문가. 공식·건조. "행정절차법 제21조 사전통지 요건을 확인해야 합니다", "혁신법 제32조제4항 고려사항 반영 여부를 체크해야 합니다" 식. 항상 조문 번호 명시.

[확정 안건]
- 참여제한: ${cp.sanctions.participation_restriction.final || '미정'}
- 환수금액: ${fmtWon(cp.sanctions.recovery.final_amount) || '미정'}
- 제재부가금: ${cp.sanctions.surcharge.applicable===false?'해당없음':(fmtWon(cp.sanctions.surcharge.final_amount)||'미정')}
- 위반행위: ${cp.violation.behavior || '(미입력)'}

[토의 목표]
1. 절차적 하자(사전통지·소명·처분사유 고지 등) 및 입증 부족 지적
2. 행정소송 리스크(재량권 일탈·남용, 금액 산정 근거 미비, 시효) 분석
3. 처분권한 명의·전문기관 대행 범위 확인
4. 안건 보완 방향 제시

[출력 형식 — 반드시 준수]
- 각 줄은 반드시 "이민준: ", "김태원: ", "박서연: ", "최두현: ", "정상민: " 중 하나로 시작한다.
- **, ##, 숫자+점 등 마크다운을 절대 사용하지 않는다.
- 5명이 번갈아 발언, 1인당 최소 1줄 이상, 전체 10~15줄.
- 이민준·박서연은 공격적으로, 김태원·최두현은 신중하게, 정상민은 조문만 인용해서 발언한다.`;

  let fullText = '';
  try {
    for await (const chunk of streamOpenAIText(prompt, 2000)) {
      fullText += chunk;
      streamMsg.text = fullText;
      patchMockDiscThread();
    }
    streamMsg.streaming = false;
    const parsed = parseMockDiscussionLines(fullText);
    const personas = parsed.filter(m => MOCK_COMMITTEE[m.speaker]);
    ui.mockDiscScript = personas.length >= 3
      ? [openingMsg, ...personas]
      : [openingMsg, {speaker:'law-prog', text: fullText.trim() || '모의 토의 생성을 완료하지 못했습니다.'}];
  } catch(err) {
    ui.mockDiscScript = [{speaker:'sys', text:`API 오류: ${err.message}`}];
    console.error('[startMockDiscussion]', err);
  }

  ui.mockDiscStep = 0;
  ui.mockDiscDone = false;
  ui.isMockApiLoading = false;
  render();
  autoAdvanceMockDisc();
}

function autoAdvanceMockDisc() {
  if (ui.mockDiscStep < ui.mockDiscScript.length - 1) {
    mockDiscTimer = setTimeout(() => {
      ui.mockDiscStep++;
      patchMockDiscThread();
      autoAdvanceMockDisc();
    }, 400);
  } else if (ui.mockDiscStep >= ui.mockDiscScript.length - 1) {
    ui.mockDiscDone = true;
    render();
    setTimeout(scrollToBottomMockDisc, 50);
  }
}

async function submitMockDiscIntervention() {
  const input = document.getElementById('mockDiscIntervene');
  const t = (input ? input.value : val('mockDiscIntervene') || '').trim();
  if (!t || ui.isMockApiLoading) return;

  if (mockDiscTimer) clearTimeout(mockDiscTimer);
  ui.mockDiscDone = false;
  ui.isMockApiLoading = true;

  ui.mockDiscScript = ui.mockDiscScript.slice(0, ui.mockDiscStep + 1);
  ui.mockDiscScript.push({speaker:'usr', text: t});
  if (input) input.value = '';
  addLog('사용자', '모의토론 개입', t);

  const streamMsg = {speaker:'law-prog', text:'', streaming: true};
  ui.mockDiscScript.push(streamMsg);
  ui.mockDiscStep = ui.mockDiscScript.length - 1;
  patchMockDiscThread();

  const contextStr = ui.mockDiscScript
    .filter(m => !m.streaming)
    .slice(-8)
    .map(m => {
      const p = MOCK_COMMITTEE[m.speaker];
      const label = p ? p.name : (m.speaker === 'usr' ? '위원장' : '시스템');
      return `${label}: ${m.text.trim()}`;
    }).join('\n');

  const prompt = `국가연구개발사업 제재처분 모의 위원회 (5인). 위반행위: ${cp.violation.behavior || '미입력'}.

[위원 역할]
이민준(공격형 변호사): 절차·재량 결함 공격. 단호 직설.
김태원(수비형 변호사): 조문 원문 중심. 신중 완서.
박서연(공격형 회계사): 금액 산정 오류 공격. 예리 빠름.
최두현(수비형 회계사): 정산 줄 단위 검토. 꼼꼼 단계적.
정상민(행정전문가): 조문만 인용. 공식 건조. 항상 조문 번호 명시.

[최근 토의]
${contextStr}

[지시]
- 위원장(사용자) 발언에 적절한 위원 2~3명이 각자의 성향대로 답변한다.
- 각 줄은 반드시 "이민준: ", "김태원: ", "박서연: ", "최두현: ", "정상민: " 중 하나로 시작한다.
- **, ## 등 마크다운 금지. 전체 4~6줄.`;

  let fullText = '';
  try {
    for await (const chunk of streamOpenAIText(prompt, 900)) {
      fullText += chunk;
      streamMsg.text = fullText;
      patchMockDiscThread();
    }
    streamMsg.streaming = false;
    const parsed = parseMockDiscussionLines(fullText);
    const personas = parsed.filter(m => MOCK_COMMITTEE[m.speaker]);
    ui.mockDiscScript.pop();
    if (personas.length > 0) {
      personas.forEach(m => ui.mockDiscScript.push(m));
    } else if (fullText.trim()) {
      ui.mockDiscScript.push({speaker:'law-prog', text: fullText.trim()});
    } else {
      ui.mockDiscScript.push({speaker:'sys', text:'답변을 생성하지 못했습니다. 다시 시도해 주세요.'});
    }
    addLog('시스템 에이전트', 'AI 답변', '모의토론 개입 답변 완료.');
  } catch (error) {
    streamMsg.streaming = false;
    ui.mockDiscScript.pop();
    ui.mockDiscScript.push({speaker:'sys', text:`API 오류: ${error.message}`});
    console.error('[submitMockDiscIntervention]', error);
  }

  ui.mockDiscStep = ui.mockDiscScript.length - 1;
  ui.isMockApiLoading = false;
  render();
  setTimeout(scrollToBottomMockDisc, 50);
}

function toggleChat(){
  ui.chatOpen = !ui.chatOpen;
  const panel = document.getElementById('chatPanel');
  if(!panel) return;
  if(ui.chatOpen){
    panel.classList.add('open');
    if(ui.chatHistory.length===0){
      ui.chatHistory.push({role:'agent', text:`안녕하세요! 제재처분 시스템 도우미입니다. 사용법이나 관련 법령, 가이드가 필요하시면 편하게 질문해 주세요.`});
      renderChatMessages();
    }
  } else { panel.classList.remove('open'); }
}

function renderChatMessages(){
  const box = document.getElementById('chatMsgs');
  if(!box) return;
  box.innerHTML = ui.chatHistory.map(m=>{
    if (m.text.includes('<span class="spinner">')) {
      return `<div class="cmsg-${m.role==='user'?'user':'agent'}">${m.text}</div>`;
    }
    return `<div class="cmsg-${m.role==='user'?'user':'agent'}">${nl2br(m.text)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  if(!input || !input.value.trim()) return;
  
  const q = input.value.trim(); 
  input.value = '';
  
  ui.chatHistory.push({role:'user', text:q});
  ui.chatHistory.push({role:'agent', text:'<span class="spinner dark"></span> 답변을 작성 중입니다...'});
  renderChatMessages();

  const prompt = `
  너는 '국가연구개발사업 제재처분 안건 초안 작성 시스템'의 친절한 안내 도우미(챗봇)야.
  사용자는 시스템 사용법, 관련 법령(국가연구개발혁신법 등), 진행 절차 등에 대해 물어볼 거야.
  아주 간결하고 가독성 좋게, 친절한 어조로 답변해 줘.
  출처나 법적 근거가 명확하지 않으면 '모르겠습니다'라고 해.
  가짜 URL이나 가짜 판례, 허위 규정은 절대로 지어내지 마.

  [사용자 질문]
  ${q}
  `;

  try {
    const reply = await getOpenAIResponse(prompt);
    ui.chatHistory.pop(); // Remove spinner
    ui.chatHistory.push({role:'agent', text: reply.trim()});
  } catch (error) {
    ui.chatHistory.pop();
    ui.chatHistory.push({role:'agent', text: `API 통신 오류로 답변할 수 없습니다: ${error.message}`});
  }
  
  renderChatMessages();
}

function setMobileTab(t){ ui.mobileTab=t; render(); }
function startCase(){ cp.phase=0; addLog('사용자','시작','사건 접수를 시작했습니다.'); render(); }

function quickIntervene(text) {
  const input = document.getElementById('discIntervene');
  if (input) input.value = text;
  submitDiscIntervention();
}

render();
requestAnimationFrame(openOpenAIApiDialog);
